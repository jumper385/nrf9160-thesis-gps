CONFIG_TFM_PROFILE_TYPE_MINIMAL=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

# TF-M (same as the GNSS sample)
CONFIG_TFM_PROFILE_TYPE_MINIMAL=y

# General
#CONFIG_TFM_ENABLE_CP10CP11=y
#CONFIG_FPU=y
CONFIG_PICOLIBC_IO_FLOAT=y
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# Modem
CONFIG_NRF_MODEM_LIB=y

# LTE link control. The "_GPS" system mode is required, otherwise the modem
# refuses to activate GNSS. Use LTE_M_GPS or NBIOT_GPS to match your SIM/carrier.
CONFIG_LTE_LINK_CONTROL=y
CONFIG_LTE_NETWORK_MODE_LTE_M_GPS=y

# Networking: modem-offloaded sockets, no native stack
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y

# CoAP packet library
CONFIG_COAP=y

# Memory
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
